version: "3.8"

services:
  # 增量同步守护进程（常驻）
  sync-daemon:
    image: anyshare-sync:latest
    container_name: anyshare-sync-daemon
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./config:/app/config:ro        # 配置文件（只读）
      - ./data:/app/data               # checkpoint 和数据库状态
      - ./logs:/app/logs               # 日志
      - /tmp/anyshare-sync:/tmp/anyshare-sync  # 临时文件
    command: python3 daemon.py

  # 全量迁移（按需执行，用完自动退出）
  # 示例：docker compose run --rm sync-job python3 import_org.py
  sync-job:
    image: anyshare-sync:latest
    container_name: anyshare-sync-job
    profiles: ["job"]                  # 不随 up 自动启动
    environment:
      - TZ=Asia/Shanghai
      - DEPT_NAME=${DEPT_NAME:-}
      - DEPT_GNS=${DEPT_GNS:-}
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./logs:/app/logs
      - /tmp/anyshare-sync:/tmp/anyshare-sync
