[project]
name = "anyshare-sync"
version = "0.1.0"
description = "AnyShare -> BISHENG sync middleware"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "celery>=5.5",
    "redis>=7.0",
    "sqlmodel>=0.0.27",
    "alembic>=1.17",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "pytest-httpx>=0.30"]
